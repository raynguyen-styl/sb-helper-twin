# SMART Buddy — shared nginx-proxy snippet (add to the platform proxy, like the nparks blocks).
# Give SMART Buddy its OWN hostname (never tree-twin-uat.styl.solutions). Requires the compose
# services on the shared `backend` network so the proxy can resolve them by container name.
#
# Two routes: the frontend (static app) and the sb-api read service. Gate behind Keycloak/auth
# (answers carry hashed-but-real ids) — mirror how /api/nparks/ is protected.

server {
    listen 443 ssl;
    server_name smart-buddy-uat.styl.solutions;   # example — pick your hostname + TLS cert

    # ssl_certificate     /etc/nginx/certs/smart-buddy-uat.crt;
    # ssl_certificate_key /etc/nginx/certs/smart-buddy-uat.key;

    # sb-api read service — the frontend calls it at  <host>/smartbuddy-api/api/...
    # (VITE_SB_API_URL = https://smart-buddy-uat.styl.solutions/smartbuddy-api)
    location /smartbuddy-api/ {
        # auth_request /_keycloak;                 # gate like /api/nparks/ if exposing externally
        proxy_pass http://smartbuddy-api:3320/;    # trailing slash strips the /smartbuddy-api prefix
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # frontend (static SPA)
    location / {
        proxy_pass http://smartbuddy-frontend:8080;
        proxy_set_header Host $host;
    }
}
