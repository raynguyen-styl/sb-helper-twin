# SMART Buddy — InfluxDB/Ditto playback stack. Deployed on the VM alongside the shared platform
# (solace-pubsub-geo-filtering), exactly like tree-digital-twin. Isolated from tree-twin: own
# project name, container names, ports, and the `sb-net` bridge (+ the shared `backend` net so
# services can reach the platform Influx/Ditto and the nginx-proxy can resolve smartbuddy-api).
#
#   docker compose -f docker-compose.sb.yml up -d --build            # sb-api + frontend
#   docker compose -f docker-compose.sb.yml run --rm ingestion       # one-shot backfill (--write)
#
# Shared platform services (InfluxDB, Ditto, Solace, Keycloak, nginx-proxy) are NOT here — set
# their URLs/creds via .env. SMART Buddy history goes to the shared `rtls` bucket under sb_*
# measurements; twins to the `org.smartbuddy` Ditto namespace.
name: smartbuddy

networks:
  sb-net:
    driver: bridge
  backend:
    external: true
    name: ${BACKEND_NETWORK:-solace-pubsub-geo-filtering_backend}

services:
  # ── read API (InfluxDB history + Ditto state) ────────────────────────────────
  smartbuddy-api:
    build: { context: ./sb-api }
    container_name: smartbuddy-api
    restart: always
    environment:
      INFLUX_URL: ${INFLUX_URL:?Set INFLUX_URL (shared InfluxDB) in .env}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?Set INFLUX_TOKEN in .env}
      INFLUX_ORG: ${INFLUX_ORG:-styl}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-rtls}
      DITTO_BASE_URL: ${DITTO_BASE_URL:?Set DITTO_BASE_URL (shared Ditto) in .env}
      DITTO_USERNAME: ${DITTO_USERNAME:-ditto}
      DITTO_PASSWORD: ${DITTO_PASSWORD:?Set DITTO_PASSWORD in .env}
      DITTO_NAMESPACE: ${DITTO_NAMESPACE:-org.smartbuddy}
      SB_API_PORT: "3320"
      SB_API_KEY: ${SB_API_KEY:-}
      POC_START: ${POC_START:-2026-02-01}
      POC_END: ${POC_END:-2026-02-28}
    expose: ["3320"]
    ports:
      - "${SB_API_HOST_PORT:-3320}:3320"   # host 3320 (tree-twin api uses 3310)
    networks: [sb-net, backend]
    deploy: { resources: { limits: { memory: 192m } } }
    logging: { options: { max-size: 10m } }

  # ── frontend (Vite → nginx); playback reads sb-api, chat reaches SAM ─────────
  smartbuddy-frontend:
    build:
      context: ../smart-buddy-app
      args:
        VITE_SB_API_URL: ${VITE_SB_API_URL:-}
        VITE_SOLACE_URL: ${VITE_SOLACE_URL:-}
        VITE_SOLACE_VPN: ${VITE_SOLACE_VPN:-}
        VITE_SOLACE_USER: ${VITE_SOLACE_USER:-}
        VITE_SOLACE_PASSWORD: ${VITE_SOLACE_PASSWORD:-}
    container_name: smartbuddy-frontend
    restart: always
    ports:
      - "${SB_FRONTEND_PORT:-8089}:8080"   # tree-twin uses 8087 / 8088
    networks: [sb-net]
    deploy: { resources: { limits: { memory: 64m } } }
    logging: { options: { max-size: 10m } }

  # ── one-shot backfill (feb_data -> Influx + Ditto). `docker compose run` ─────
  ingestion:
    build: { context: ./ingestion }
    container_name: smartbuddy-ingestion
    profiles: ["backfill"]
    env_file: [./ingestion/.env]
    volumes:
      - ../feb_data:/data/feb_data:ro
      - ../analysis:/data/analysis:ro
    networks: [sb-net, backend]
    logging: { options: { max-size: 10m } }
