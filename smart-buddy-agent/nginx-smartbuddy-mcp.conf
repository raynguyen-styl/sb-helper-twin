# nginx-proxy route for the SMART Buddy MCP adapter (shared-VM path).
# Add this location to the platform nginx-proxy server block that the SAM mesh uses
# to reach agent MCP endpoints — mirrors the arborist `/arborist-mcp/` route.
#
# Prereq: smartbuddy-mcp must be on the same docker network as the proxy — enable the
# `backend` network opt-in in docker-compose.sam.yml so `smartbuddy-mcp` resolves.
#
# The MCP server enforces its own Bearer MCP_API_KEY, so no auth_request is needed here;
# this route only needs to reach the container. Do NOT expose this path to the public
# internet — it should be reachable only from the mesh/agent network.

location /smartbuddy-mcp/ {
    proxy_pass         http://smartbuddy-mcp:3501/;
    proxy_http_version 1.1;

    # MCP StreamableHTTP: allow streamed responses (SSE) and long LLM-driven calls.
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_buffering    off;                 # stream tool results instead of buffering
    proxy_read_timeout 120s;                # a slow query + LLM round-trip
    proxy_send_timeout 120s;
}

# The SAM agent is then configured with MCP base URL:
#   https://<this-proxy-host>/smartbuddy-mcp/mcp     (Bearer: MCP_API_KEY)
# and health at:
#   https://<this-proxy-host>/smartbuddy-mcp/health
