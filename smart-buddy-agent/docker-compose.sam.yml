# SMART Buddy — SAM agent data stack (the MCP adapter over the Feb DuckDB store).
# Split out from the root docker-compose.yml (frontend) exactly like tree-digital-twin
# splits its app services from the rag-ai stack. Run alongside the frontend:
#
#   # from the repo root:
#   docker compose -f docker-compose.yml -f smart-buddy-agent/docker-compose.sam.yml up -d --build
#
# The Feb DuckDB file is NOT built here and NOT baked into the image (it needs Python +
# the gitignored parquets, and carries real ids). Build it on the analysis workstation
# (`python smart-buddy-agent/build_feb_duckdb.py`) and copy smart-buddy-agent/data/feb.duckdb
# to this path on the host; it is bind-mounted READ-ONLY below. See AGENT_DEPLOY.md.
#
# Isolation (no collision with tree-twin OR the arborist agent):
#   • project `smartbuddy` (shared with the frontend compose)
#   • container `smartbuddy-mcp`, internal port 3501 (arborist MCP uses 3500)
#   • NO host port — reachable only in-network (the SAM agent calls it via nginx-proxy)
#   • private `sb-net`; join shared `backend` only when routing via the platform proxy

name: smartbuddy

networks:
  sb-net:
    driver: bridge
  # OPT-IN — uncomment here AND on the service when co-hosting behind the platform
  # nginx-proxy so the agent can reach /smartbuddy-mcp/ (see nginx-smartbuddy-mcp.conf).
  # backend:
  #   external: true
  #   name: ${BACKEND_NETWORK:-solace-pubsub-geo-filtering_backend}

services:
  smartbuddy-mcp:
    build:
      context: ./smartbuddy-mcp
    container_name: smartbuddy-mcp
    restart: always
    expose:
      - "3501"                       # in-network only — never published to a host port
    environment:
      MCP_PORT: "3501"
      FEB_DUCKDB_PATH: /app/data/feb.duckdb
      MCP_API_KEY: ${SB_MCP_API_KEY:?set SB_MCP_API_KEY to a fresh secret — never a tree-twin key}
      MCP_MAX_ROWS_DEFAULT: "1000"
      MCP_MAX_ROWS_HARD: "5000"
      MCP_QUERY_TIMEOUT_MS: "15000"
    volumes:
      - ./data:/app/data:ro          # read-only bind mount of feb.duckdb (built + shipped separately)
    networks: [sb-net]
    # networks: [sb-net, backend]     # use instead when routing via the shared nginx-proxy
    deploy: { resources: { limits: { memory: 192m } } }
    logging: { options: { max-size: 10m } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3501/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
