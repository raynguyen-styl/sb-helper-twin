# SMART Buddy frontend nginx — the SINGLE public entry for the demo. The ALB maps the whole
# hostname (smartbuddy-helper-uat.styl.solutions/*) to this container, and nginx same-origin
# routes everything (like car-identify's toll-dashboard / atlantic's super-admin-web):
#   /                 → the static SPA (hash routing)
#   /smartbuddy-api/  → api-service (the insight bundles + Playback reads). NOT token-checked:
#                       central-specs decision 0003 (the browser's CIAM login is the only gate)
#   /auth/token       → the CIAM token endpoint, with the client secret added (POST only)
# That is the only backend route since central-specs decision 0002 (one mode, no upload, no sync,
# the chat's agents reached over Solace, not through this nginx). So NO change to the shared platform
# nginx-proxy is needed. This container joins the `backend` network (see docker-compose.yml) to reach
# the smartbuddy-api container by name.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # docker DNS — resolve backend upstreams at request time so nginx still starts if a
    # service (or the whole backend stack) isn't up yet; the route just 502s until it is.
    resolver 127.0.0.11 valid=10s;

    # sb-api — same-origin proxy to the read API (the rewrite strips the prefix). No token check here
    # (decision 0003): the shared jwt-validator trusts only the old styl-iot realm, not CIAM.
    location /smartbuddy-api/ {
        set $sb_api http://smartbuddy-api:3320;
        rewrite ^/smartbuddy-api/(.*)$ /$1 break;
        proxy_pass $sb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Keycloak token proxy (from Bibo Bus). The login's client `demo-application` is confidential and
    # a browser cannot hold its secret, so keycloak-js posts its token requests (code exchange,
    # refresh) here; the include adds the client's credentials and forwards to the CIAM token
    # endpoint. docker/40-keycloak-token-proxy.sh writes the include at container start.
    location = /auth/token {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        include /etc/nginx/keycloak-token.conf;
    }

    # Content-hashed build assets (Vite emits index-<hash>.js/.css) are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry document, so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # SPA fallback — the app routes client-side via hash (#role=, #school=, #stall=, #terminal=, #feb=).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
