#
# SMART Buddy — the digital twin: the dashboard a viewer sees (Vite → nginx), deployed on the shared VM
# alongside the platform. Everything behind it — the read API over the Postgres serving store — lives in
# the sibling `backend` repository with its own compose file. Both repositories declare compose project
# `smartbuddy`, so containers, images and networks keep the names they had when this was one repository.
# This stack therefore sees the backend's container as an "orphan" and compose warns — expected; NEVER
# pass --remove-orphans here (it would stop the backend).
#
#   docker compose up -d --build          # smartbuddy-frontend
#
# The frontend starts with or without the backend: its nginx resolves smartbuddy-api / jwt-validator per
# request, so /smartbuddy-api/ just fails (500 while the token check cannot reach jwt-validator, 502
# while smartbuddy-api is down) until the platform + backend are up.
#
# Isolation from tree-twin / other demos (checked against the live VM registry):
#   • project `smartbuddy` · container `smartbuddy-frontend`
#   • ONE public hostname: the ALB maps smartbuddy-helper-uat.styl.solutions/* → the frontend
#     (host 8097, free on the VM). Its nginx same-origin-proxies /smartbuddy-api/ to the backend
#     container — so the shared nginx-proxy is NOT touched.
#   • `sb-net` + the shared external `backend` net (to reach smartbuddy-api / jwt-validator)
#
# SAM chat transport: with no VITE_SOLACE_* set, the build targets the shared local Solace that
# atlantic-platform/common runs on every box (ws://localhost:8008, VPN + client-username `default`,
# see common/README.md — not secrets). Set the four values (bootstrap-env.sh does) to use another broker.

name: smartbuddy

networks:
  sb-net:
    driver: bridge
  backend:
    external: true
    name: ${BACKEND_NETWORK:-solace-pubsub-geo-filtering_backend}

services:
  # ── frontend (Vite → nginx). Every window reads sb-api; the chat reaches the agents over Solace ──
  smartbuddy-frontend:
    build:
      context: ./client
      args:
        # Read API base (proxied sb-api). Empty → Playback uses bundled demo data (offline dev).
        VITE_SB_API_URL: ${VITE_SB_API_URL:-}
        # Keycloak (shared realm styl-iot). Empty → app runs without login (local dev only).
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-styl-iot}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-smart-buddy}
        # SAM chat transport. Defaults = the box's shared local Solace (atlantic-platform/common);
        # the values are baked into the browser bundle, so only ever low-privilege demo creds here.
        VITE_SOLACE_URL: ${VITE_SOLACE_URL:-ws://localhost:8008}
        VITE_SOLACE_VPN: ${VITE_SOLACE_VPN:-default}
        VITE_SOLACE_USER: ${VITE_SOLACE_USER:-default}
        VITE_SOLACE_PASSWORD: ${VITE_SOLACE_PASSWORD:-default}
        # The chat's Solace topics — one set (central-specs capability sam-chat). Empty = the code's
        # default: STYL/iot/smartbuddy-live/system/shared/v1/sam/chat/{request,response,error}, the
        # topics the Redshift agent's gateway rule answers on today. See DEPLOY.md "The chat".
        VITE_SAM_TOPIC_REQUEST: ${VITE_SAM_TOPIC_REQUEST:-}
        VITE_SAM_TOPIC_RESPONSE: ${VITE_SAM_TOPIC_RESPONSE:-}
        VITE_SAM_TOPIC_ERROR: ${VITE_SAM_TOPIC_ERROR:-}
    container_name: smartbuddy-frontend
    restart: always
    ports:
      - "${SB_FRONTEND_PORT:-8097}:8080"    # ALB maps smartbuddy-helper-uat.styl.solutions/* here (8097 free on the VM)
    # on `backend` too: this container's nginx same-origin-proxies /smartbuddy-api/ to the backend
    # container (see client/nginx.conf) — one hostname serves all.
    networks: [sb-net, backend]
    deploy: { resources: { limits: { memory: 64m } } }
    logging: { options: { max-size: 10m } }
