# SMART Buddy frontend nginx — the SINGLE public entry for the demo. The ALB maps the whole
# hostname (smartbuddy-helper-uat.styl.solutions/*) to this container, and nginx same-origin
# routes everything (like car-identify's toll-dashboard / atlantic's super-admin-web):
#   /                 → the static SPA (hash routing)
#   /smartbuddy-api/  → api-service (the insight bundles + Playback reads), Keycloak-gated
# That is the only backend route since central-specs decision 0002 (one mode, no upload, no sync,
# the chat's agents reached over Solace, not through this nginx). So NO change to the shared platform
# nginx-proxy is needed. This container joins the `backend` network (see docker-compose.yml) to reach
# the smartbuddy-api / jwt-validator containers by name.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # docker DNS — resolve backend upstreams at request time so nginx still starts if a
    # service (or the whole backend stack) isn't up yet; the route just 502s until it is.
    resolver 127.0.0.11 valid=10s;

    # Internal JWT validation via the shared jwt-validator (same contract as the platform proxy).
    location = /_validate_jwt {
        internal;
        set $jwtv http://jwt-validator:3200;
        proxy_pass $jwtv/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;
    }

    # sb-api — Keycloak-gated, then same-origin proxy to the read API (trailing slash strips prefix).
    location /smartbuddy-api/ {
        auth_request /_validate_jwt;
        set $sb_api http://smartbuddy-api:3320;
        rewrite ^/smartbuddy-api/(.*)$ /$1 break;
        proxy_pass $sb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Content-hashed build assets (Vite emits index-<hash>.js/.css) are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry document, so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # SPA fallback — the app routes client-side via hash (#role=, #school=, #stall=, #terminal=, #feb=).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
