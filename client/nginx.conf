# SMART Buddy frontend nginx — the SINGLE public entry for the demo. The ALB maps the whole
# hostname (smart-buddy-helper-uat.styl.solutions/*) to this container, and nginx same-origin
# routes everything (like car-identify's toll-dashboard / atlantic's super-admin-web):
#   /                 → the static SPA (hash routing)
#   /smartbuddy-api/  → api-service (Playback reads), Keycloak-gated
#   /smartbuddy-mcp/  → mcp-service (SAM agent), Bearer-guarded by the MCP itself
# So NO change to the shared platform nginx-proxy is needed. This container joins the `backend`
# network (see docker-compose.yml) to reach the sb-api / mcp / jwt-validator containers by name.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # docker DNS — resolve backend upstreams at request time so nginx still starts if a
    # service (or the whole agent stack) isn't up yet; those routes just 502 until it is.
    resolver 127.0.0.11 valid=10s;

    # Internal JWT validation via the shared jwt-validator (same contract as the platform proxy).
    location = /_validate_jwt {
        internal;
        set $jwtv http://jwt-validator:3200;
        proxy_pass $jwtv/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;
    }

    # sb-api (Playback) — Keycloak-gated, then same-origin proxy to the read API (trailing slash strips prefix).
    location /smartbuddy-api/ {
        auth_request /_validate_jwt;
        set $sb_api http://smartbuddy-api:3320;
        rewrite ^/smartbuddy-api/(.*)$ /$1 break;
        proxy_pass $sb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SAM MCP — reached by the SAM agent on the mesh. Guarded by the MCP's own Bearer (MCP_API_KEY);
    # stream tool results (SSE) and allow slow LLM-driven calls.
    location /smartbuddy-mcp/ {
        set $sb_mcp http://smartbuddy-mcp:3501;
        rewrite ^/smartbuddy-mcp/(.*)$ /$1 break;
        proxy_pass $sb_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Ingest service (dashboard "Upload data" tab) — Keycloak-gated; allows large multipart uploads.
    location /smartbuddy-ingest/ {
        auth_request /_validate_jwt;
        auth_request_set $auth_roles $upstream_http_x_auth_roles;
        auth_request_set $auth_user  $upstream_http_x_auth_user;
        client_max_body_size 550m;                 # matches SB_INGEST_MAX_MB (512) + overhead
        set $sb_ing http://smartbuddy-ingest:8200;
        rewrite ^/smartbuddy-ingest/(.*)$ /$1 break;
        proxy_pass $sb_ing;
        proxy_request_buffering off;               # stream the upload through, don't buffer to disk first
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Auth-Roles      $auth_roles;
        proxy_set_header X-Auth-User       $auth_user;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Content-hashed build assets (Vite emits index-<hash>.js/.css) are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry document, so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # SPA fallback — the app routes client-side via hash (#role=, #school=, #stall=, #terminal=, #feb=).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
