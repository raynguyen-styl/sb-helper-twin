server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — the app routes client-side via hash (#role=, #school=, #stall=,
    # #terminal=, #feb=), so any path resolves to index.html and the app takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed build assets (Vite emits index-<hash>.js/.css) are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry document, so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
