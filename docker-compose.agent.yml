# SMART Buddy — SAM agent data stack: the MCP adapter that runs the agent's NL->SQL over the
# SMART Buddy tables in the SHARED ClickHouse (database `smartbuddy`). Split out from the root
# docker-compose.yml exactly like tree-digital-twin splits its app services from the rag-ai stack.
#
#   # from the repo root, alongside the app stack:
#   docker compose -f docker-compose.yml -f docker-compose.agent.yml up -d --build
#
#   # one-shot load of the Feb data into ClickHouse (needs the parquets under ./analysis on the host):
#   docker compose -f docker-compose.yml -f docker-compose.agent.yml --profile ingest run --rm ch-ingest
#
# The MCP holds NO data — it queries the shared `clickhouse` instance as a DEDICATED READ-ONLY user
# scoped to the `smartbuddy` database (created by ch-ingest), so the agent can never touch the other
# demos' tables. See DEPLOY.md.
#
# Isolation (no collision with tree-twin OR the arborist agent):
#   • project `smartbuddy` (shared with the frontend compose)
#   • container `smartbuddy-mcp`, internal port 3501 (arborist MCP uses 3500)
#   • NO host port — reachable only in-network (the SAM agent calls it via nginx-proxy)
#   • on `sb-net` + the shared `backend` net (to reach clickhouse:8123 and let the proxy resolve it)

name: smartbuddy

networks:
  sb-net:
    driver: bridge
  backend:
    external: true
    name: ${BACKEND_NETWORK:-solace-pubsub-geo-filtering_backend}

services:
  smartbuddy-mcp:
    build:
      context: ./mcp-service
    container_name: smartbuddy-mcp
    restart: always
    expose:
      - "3501"                       # in-network only — never published to a host port
    environment:
      MCP_PORT: "3501"
      MCP_API_KEY: ${SB_MCP_API_KEY:?set SB_MCP_API_KEY to a fresh secret — never a tree-twin key}
      # Shared ClickHouse — connect as the READ-ONLY user (SELECT only on the smartbuddy db).
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-smartbuddy}
      CLICKHOUSE_USER: ${CLICKHOUSE_RO_USER:-smartbuddy_ro}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:?set CLICKHOUSE_RO_PASSWORD (the read-only user's password)}
      MCP_MAX_ROWS_DEFAULT: "1000"
      MCP_MAX_ROWS_HARD: "5000"
      MCP_QUERY_TIMEOUT_MS: "15000"
      MCP_MAX_MEMORY_BYTES: "2000000000"
    networks: [sb-net, backend]
    deploy: { resources: { limits: { memory: 192m } } }
    logging: { options: { max-size: 10m } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3501/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── one-shot: Feb parquets -> shared ClickHouse `smartbuddy` (creates db + read-only user) ───────
  ch-ingest:
    build:
      context: ./ingestion-service
    container_name: smartbuddy-ch-ingest
    profiles: ["ingest"]
    environment:
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-smartbuddy}
      # Admin creds (the shared instance's superuser) — needed once to CREATE DATABASE/USER.
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER:?set CLICKHOUSE_ADMIN_USER (shared ClickHouse admin)}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?set CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_RO_USER: ${CLICKHOUSE_RO_USER:-smartbuddy_ro}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:?set CLICKHOUSE_RO_PASSWORD (created for the MCP)}
      SB_ID_SALT: ${SB_ID_SALT:-}
      SB_ANALYSIS_DIR: /data/analysis
    volumes:
      - ./analysis:/data/analysis:ro      # parquets + school_geo.json + taxonomy.py (gitignored parquets)
    networks: [sb-net, backend]
    logging: { options: { max-size: 10m } }
