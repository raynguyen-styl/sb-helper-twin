# SMART Buddy — SAM agent data stack: the MCP adapter that runs the agent's NL->SQL over the
# SMART Buddy tables in the SHARED ClickHouse (database `smartbuddy`). Split out from the root
# docker-compose.yml exactly like tree-digital-twin splits its app services from the rag-ai stack.
#
#   # from the repo root, alongside the app stack:
#   docker compose -f docker-compose.yml -f docker-compose.agent.yml up -d --build
#
#   # one-shot: create the db + insights table + ro/rw users (no data files needed):
#   docker compose -f docker-compose.yml -f docker-compose.agent.yml --profile ingest run --rm ch-init
#
#   # data itself is loaded through the dashboard's Upload tab (smartbuddy-ingest). After a month's
#   # transactions/wearable are uploaded, (re)build its insight bundles:
#   SB_MONTH=2026-03 docker compose -f docker-compose.yml -f docker-compose.agent.yml --profile ingest run --rm ch-insights
#
# The MCP holds NO data — it queries the shared `clickhouse` instance as a DEDICATED READ-ONLY user
# scoped to the `smartbuddy` database (created by ch-init), so the agent can never touch the other
# demos' tables. See DEPLOY.md.
#
# Isolation (no collision with tree-twin OR the arborist agent):
#   • project `smartbuddy` (shared with the frontend compose)
#   • container `smartbuddy-mcp`, internal port 3501 (arborist MCP uses 3500)
#   • NO host port — reachable only in-network (the SAM agent calls it via nginx-proxy)
#   • on `sb-net` + the shared `backend` net (to reach clickhouse:8123 and let the proxy resolve it)

name: smartbuddy

networks:
  sb-net:
    driver: bridge
  backend:
    external: true
    name: ${BACKEND_NETWORK:-solace-pubsub-geo-filtering_backend}

services:
  smartbuddy-mcp:
    build:
      context: ./mcp-service
    container_name: smartbuddy-mcp
    restart: always
    expose:
      - "3501"                       # in-network only — never published to a host port
    environment:
      MCP_PORT: "3501"
      MCP_API_KEY: ${SB_MCP_API_KEY:?set SB_MCP_API_KEY to a fresh secret — never a tree-twin key}
      # Shared ClickHouse — connect as the READ-ONLY user (SELECT only on the smartbuddy db).
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-smartbuddy}
      CLICKHOUSE_USER: ${CLICKHOUSE_RO_USER:-smartbuddy_ro}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:?set CLICKHOUSE_RO_PASSWORD (the read-only user's password)}
      MCP_MAX_ROWS_DEFAULT: "1000"
      MCP_MAX_ROWS_HARD: "5000"
      MCP_QUERY_TIMEOUT_MS: "15000"
      MCP_MAX_MEMORY_BYTES: "2000000000"
    networks: [sb-net, backend]
    deploy: { resources: { limits: { memory: 192m } } }
    logging: { options: { max-size: 10m } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3501/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── one-shot: ADMIN bootstrap — create db + insights table + ro/rw users (NO data files) ─────────
  ch-init:
    build:
      context: ./ingestion-service
    container_name: smartbuddy-ch-init
    profiles: ["ingest"]
    command: ["python", "init_db.py"]
    environment:
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-smartbuddy}
      # Admin creds (the shared instance's superuser) — needed once to CREATE DATABASE/USER.
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER:?set CLICKHOUSE_ADMIN_USER (shared ClickHouse admin)}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?set CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_RO_USER: ${CLICKHOUSE_RO_USER:-smartbuddy_ro}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:?set CLICKHOUSE_RO_PASSWORD (created for the MCP)}
      CLICKHOUSE_RW_USER: ${CLICKHOUSE_RW_USER:-smartbuddy_rw}
      CLICKHOUSE_RW_PASSWORD: ${CLICKHOUSE_RW_PASSWORD:?set CLICKHOUSE_RW_PASSWORD (created for the upload service)}
    networks: [sb-net, backend]
    logging: { options: { max-size: 10m } }

  # ── one-shot: (re)build a month's precomputed insight bundles into `insights` ─────────────────────
  ch-insights:
    build:
      context: ./ingestion-service
    container_name: smartbuddy-ch-insights
    profiles: ["ingest"]
    command: ["python", "build_insights.py"]
    environment:
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-smartbuddy}
      # Reads + writes smartbuddy.* as the write user (reads facts, replaces the insights rows).
      CLICKHOUSE_USER: ${CLICKHOUSE_RW_USER:-smartbuddy_rw}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_RW_PASSWORD:?set CLICKHOUSE_RW_PASSWORD}
      SB_MONTH: ${SB_MONTH:-}   # pass per run: SB_MONTH=2026-03 docker compose … run --rm ch-insights
      SB_DUCKDB_MEMORY: ${SB_DUCKDB_MEMORY:-1GB}
    volumes:
      - sb-ingest-work:/work      # DuckDB spill dir (temp_directory=/work/duckdb_tmp)
    deploy: { resources: { limits: { memory: 5g } } }   # pulls a month of txn+txn_perf into pandas/DuckDB
    networks: [sb-net, backend]
    logging: { options: { max-size: 10m } }

  # ── HTTP ingest service — the dashboard "Upload data" tab posts CHUNKED, resumable uploads here ──
  smartbuddy-ingest:
    build:
      context: ./ingestion-service
    container_name: smartbuddy-ingest
    restart: always
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8200"]
    expose: ["8200"]                        # in-network only; reached via client nginx /smartbuddy-ingest/
    environment:
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-smartbuddy}
      # Connect as the WRITE user (SELECT/INSERT/CREATE/DROP on smartbuddy.* only — never admin).
      CLICKHOUSE_USER: ${CLICKHOUSE_RW_USER:-smartbuddy_rw}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_RW_PASSWORD:?set CLICKHOUSE_RW_PASSWORD (the upload service's write user)}
      SB_ID_SALT: ${SB_ID_SALT:-}
      # Chunked-upload workspace (parts assembled here; resumable across restarts). No file-size cap.
      SB_INGEST_WORKDIR: /work
      SB_DUCKDB_MEMORY: ${SB_DUCKDB_MEMORY:-512MB}
      SB_INGEST_SESSION_TTL_H: ${SB_INGEST_SESSION_TTL_H:-24}
      # Optional: restrict to Keycloak roles (matched vs X-Auth-Roles from the proxy). Empty = any signed-in user.
      SB_INGEST_ALLOWED_ROLES: ${SB_INGEST_ALLOWED_ROLES:-}
    volumes:
      - sb-ingest-work:/work                # persistent scratch for chunk assembly + DuckDB spill
    networks: [sb-net, backend]
    # cap allows the transient in-process insight rebuild after a load (pulls a month into DuckDB);
    # idle usage is tiny. It's a ceiling, not a reservation.
    deploy: { resources: { limits: { memory: 3g } } }
    logging: { options: { max-size: 10m } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8200/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sb-ingest-work:
